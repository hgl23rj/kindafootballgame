<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labyrinth: Light the Pillars</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #121212;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #1e1e1e;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 2px solid #333;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 500px;
            margin-bottom: 12px;
            padding: 0 5px;
        }
        .title { font-size: 16px; font-weight: bold; color: #4facfe; }
        .level-info { font-size: 14px; background: #2a2a2a; padding: 4px 10px; border-radius: 6px; color: #ddd; }
        canvas {
            background: #0f172a;
            border-radius: 8px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
            cursor: pointer;
            display: block;
            border: 2px solid #334155;
        }
        .footer-controls {
            margin-top: 12px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 8px 16px;
            background: #334155;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #475569; }
        .instructions {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 10px;
            text-align: center;
            max-width: 500px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="header">
        <div class="title">🔮 Labyrinth: Ray Puzzle</div>
        <div class="level-info" id="level-display">Level: 1 / 3</div>
    </div>

    <canvas id="canvas" width="480" height="480"></canvas>

    <div class="footer-controls">
        <button onclick="resetLevel()">Restart Level</button>
        <button onclick="nextLevel()" id="next-btn" style="display:none; background: #10b981;">Next Level ➔</button>
    </div>
    <div class="instructions">Click on mirror stones to rotate them 90°. Guide the laser beam from the source to light up all target pillars!</div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const TILE_SIZE = 60;
const GRID_SIZE = 8; // 8x8 grid (480x480 pixels)

// Game Levels Definition
// types: 'empty', 'wall', 'laser', 'pillar', 'mirror'
// mirror types / rotations: mirror angles (0: \, 1: /) or custom rotations
let currentLevelIndex = 0;

const levels = [
    {
        laser: { x: 0, y: 3, dir: 'RIGHT' },
        pillars: [{ x: 7, y: 3 }],
        mirrors: [
            { x: 3, y: 3, angle: 0 } // angle 0 = \, angle 1 = /
        ],
        walls: [{ x: 3, y: 1 }, { x: 3, y: 2 }]
    },
    {
        laser: { x: 0, y: 0, dir: 'RIGHT' },
        pillars: [{ x: 7, y: 7 }],
        mirrors: [
            { x: 7, y: 0, angle: 0 },
            { x: 7, y: 4, angle: 1 },
            { x: 3, y: 4, angle: 0 }
        ],
        walls: [{ x: 3, y: 0 }, { x: 3, y: 1 }, { x: 3, y: 2 }]
    },
    {
        laser: { x: 0, y: 7, dir: 'UP' },
        pillars: [{ x: 7, y: 0 }, { x: 0, y: 0 }],
        mirrors: [
            { x: 0, y: 0, angle: 1 },
            { x: 7, y: 7, angle: 0 },
            { x: 7, y: 0, angle: 1 }
        ],
        walls: [{ x: 2, y: 2 }, { x: 4, y: 4 }, { x: 5, y: 2 }]
    }
];

let levelData = null;

function loadLevel(index) {
    if (index >= levels.length) {
        alert("Congratulations! You completed all labyrinth ray puzzles!");
        currentLevelIndex = 0;
        index = 0;
    }
    currentLevelIndex = index;
    document.getElementById('level-display').innerText = `Level: ${currentLevelIndex + 1} / ${levels.length}`;
    document.getElementById('next-btn').style.display = 'none';

    // Deep copy level data so mutations don't persist permanently
    const original = levels[index];
    levelData = {
        laser: { ...original.laser },
        pillars: original.pillars.map(p => ({ ...p, lit: false })),
        mirrors: original.mirrors.map(m => ({ ...m })),
        walls: original.walls.map(w => ({ ...w }))
    };
}

// Handle clicks to rotate mirrors
canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const clickX = Math.floor((e.clientX - rect.left) / TILE_SIZE);
    const clickY = Math.floor((e.clientY - rect.top) / TILE_SIZE);

    // Check if a mirror was clicked
    const mirror = levelData.mirrors.find(m => m.x === clickX && m.y === clickY);
    if (mirror) {
        mirror.angle = (mirror.angle + 1) % 2; // Toggle mirror orientation
    }
});

function getNextPosition(x, y, dir) {
    let nx = x;
    let ny = y;
    if (dir === 'UP') ny--;
    if (dir === 'DOWN') ny++;
    if (dir === 'LEFT') nx--;
    if (dir === 'RIGHT') nx++;
    return { x: nx, y: ny };
}

function calculateLaserRays() {
    let currentBeam = {
        x: levelData.laser.x,
        y: levelData.laser.y,
        dir: levelData.laser.dir
    };

    let raySegments = [];
    let litPillarsCount = 0;
    
    // Reset pillar states
    levelData.pillars.forEach(p => p.lit = false);

    let maxSteps = 100; // Prevent infinite loops
    while (maxSteps > 0) {
        maxSteps--;
        
        let nextPos = getNextPosition(currentBeam.x, currentBeam.y, currentBeam.dir);

        // Check boundary limits
        if (nextPos.x < 0 || nextPos.x >= GRID_SIZE || nextPos.y < 0 || nextPos.y >= GRID_SIZE) {
            raySegments.push({ x1: currentBeam.x, y1: currentBeam.y, x2: nextPos.x, y2: nextPos.y });
            break;
        }

        // Check walls
        let hitWall = levelData.walls.some(w => w.x === nextPos.x && w.y === nextPos.y);
        if (hitWall) {
            raySegments.push({ x1: currentBeam.x, y1: currentBeam.y, x2: nextPos.x, y2: nextPos.y });
            break;
        }

        // Add segment path
        raySegments.push({ x1: currentBeam.x, y1: currentBeam.y, x2: nextPos.x, y2: nextPos.y });

        // Check pillars
        let hitPillar = levelData.pillars.find(p => p.x === nextPos.x && p.y === nextPos.y);
        if (hitPillar) {
            hitPillar.lit = true;
        }

        // Check mirrors
        let hitMirror = levelData.mirrors.find(m => m.x === nextPos.x && m.y === nextPos.y);
        if (hitMirror) {
            // Deflection rules based on mirror angle (0: \, 1: /)
            let d = currentBeam.dir;
            if (hitMirror.angle === 0) { // \ mirror
                if (d === 'RIGHT') d = 'DOWN';
                else if (d === 'LEFT') d = 'UP';
                else if (d === 'UP') d = 'LEFT';
                else if (d === 'DOWN') d = 'RIGHT';
            } else { // / mirror
                if (d === 'RIGHT') d = 'UP';
                else if (d === 'LEFT') d = 'DOWN';
                else if (d === 'UP') d = 'RIGHT';
                else if (d === 'DOWN') d = 'LEFT';
            }
            currentBeam = { x: nextPos.x, y: nextPos.y, dir: d };
        } else {
            currentBeam = { x: nextPos.x, y: nextPos.y, dir: currentBeam.dir };
        }

        // If it hit a pillar or wall, stop or continue? Standard mirror logic usually continues through or stops. Let's let it pass through pillars, stop at walls.
        if (hitWall) break;
    }

    return raySegments;
}

function checkWinCondition() {
    const allLit = levelData.pillars.every(p => p.lit);
    if (allLit) {
        document.getElementById('next-btn').style.display = 'block';
    }
}

function drawGrid() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw grid background lines
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 1;
    for (let i = 0; i <= GRID_SIZE; i++) {
        ctx.beginPath();
        ctx.moveTo(i * TILE_SIZE, 0);
        ctx.lineTo(i * TILE_SIZE, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * TILE_SIZE);
        ctx.lineTo(canvas.width, i * TILE_SIZE);
        ctx.stroke();
    }

    // Draw Walls
    levelData.walls.forEach(w => {
        ctx.fillStyle = '#334155';
        ctx.fillRect(w.x * TILE_SIZE + 4, w.y * TILE_SIZE + 4, TILE_SIZE - 8, TILE_SIZE - 8);
    });

    // Draw Laser Source
    const l = levelData.laser;
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath();
    ctx.arc(l.x * TILE_SIZE + TILE_SIZE/2, l.y * TILE_SIZE + TILE_SIZE/2, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#d97706';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Draw Pillars
    levelData.pillars.forEach(p => {
        ctx.fillStyle = p.lit ? '#10b981' : '#64748b';
        ctx.beginPath();
        ctx.arc(p.x * TILE_SIZE + TILE_SIZE/2, p.y * TILE_SIZE + TILE_SIZE/2, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = p.lit ? '#059669' : '#475569';
        ctx.lineWidth = 3;
        ctx.stroke();
    });

    // Calculate & Draw Rays
    const rays = calculateLaserRays();
    ctx.strokeStyle = '#ef4444';
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#ef4444';
    ctx.lineWidth = 4;

    rays.forEach(r => {
        ctx.beginPath();
        ctx.moveTo(r.x1 * TILE_SIZE + TILE_SIZE/2, r.y1 * TILE_SIZE + TILE_SIZE/2);
        ctx.lineTo(r.x2 * TILE_SIZE + TILE_SIZE/2, r.y2 * TILE_SIZE + TILE_SIZE/2);
        ctx.stroke();
    });
    ctx.shadowBlur = 0; // Reset shadow

    // Draw Mirrors (Stones)
    levelData.mirrors.forEach(m => {
        ctx.fillStyle = '#475569';
        ctx.fillRect(m.x * TILE_SIZE + 8, m.y * TILE_SIZE + 8, TILE_SIZE - 16, TILE_SIZE - 16);
        
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 5;
        ctx.beginPath();
        if (m.angle === 0) {
            // \ diagonal
            ctx.moveTo(m.x * TILE_SIZE + 14, m.y * TILE_SIZE + 14);
            ctx.lineTo(m.x * TILE_SIZE + TILE_SIZE - 14, m.y * TILE_SIZE + TILE_SIZE - 14);
        } else {
            // / diagonal
            ctx.moveTo(m.x * TILE_Size + 14, m.y * TILE_SIZE + TILE_SIZE - 14);
            ctx.lineTo(m.x * TILE_SIZE + TILE_SIZE - 14, m.y * TILE_SIZE + 14);
        }
        ctx.stroke();
    });

    checkWinCondition();
}

function resetLevel() {
    loadLevel(currentLevelIndex);
}

function nextLevel() {
    loadLevel(currentLevelIndex + 1);
}

function loop() {
    draw();
    requestAnimationFrame(loop);
}

// Initialize first level
loadLevel(0);
loop();
</script>

</body>
</html>
