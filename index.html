<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Bow and Arrow with Wind</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #game-container {
            background: #222;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 2px solid #444;
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 800px;
            margin-bottom: 10px;
            padding: 0 10px;
            font-size: 14px;
            font-weight: bold;
        }
        .score-board {
            background: #111;
            padding: 6px 14px;
            border-radius: 6px;
            color: #ffa519;
            font-family: monospace;
            font-size: 18px;
            border: 1px solid #333;
        }
        .wind-display {
            background: #111;
            padding: 6px 14px;
            border-radius: 6px;
            color: #3498db;
            font-family: monospace;
            font-size: 15px;
            border: 1px solid #333;
        }
        canvas {
            background: linear-gradient(to bottom, #1e3c72, #2a5298);
            border-radius: 6px;
            display: block;
            border: 2px solid #555;
            cursor: crosshair;
        }
        .footer-controls {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        button {
            padding: 8px 16px;
            background: #4285F4;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #3367d6; }
        .instructions {
            font-size: 11px;
            color: #aaa;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div class="header">
            <div>🎯 ARCHERY ARCADE</div>
            <div class="wind-display" id="wind-display">Wind: ➖ Calm</div>
            <div class="score-board" id="score-display">Score: 0 | Arrows: 10</div>
        </div>
        <canvas id="gameCanvas" width="800" height="450"></canvas>
        <div class="footer-controls">
            <button onclick="resetGame()">New Game</button>
        </div>
        <div class="instructions">Watch the wind indicator! Pull back and release to account for drift.</div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let score = 0;
let arrowsLeft = 10;
let gameState = 'playing'; // 'playing', 'gameover'
let wind = 0; // Negative = Left wind, Positive = Right wind

const bowPos = { x: 100, y: 225 };
let isAiming = false;
let dragEnd = { x: 100, y: 225 };

let activeArrow = null;
let targets = [];

class Target {
    constructor() {
        this.x = 700;
        this.y = Math.random() * 300 + 75;
        this.radius = 35;
        this.speed = Math.random() * 2 + 1.5;
        this.direction = Math.random() < 0.5 ? 1 : -1;
    }
    update() {
        this.y += this.speed * this.direction;
        if (this.y - this.radius < 40 || this.y + this.radius > 410) {
            this.direction *= -1;
        }
    }
    draw() {
        const rings = ['#e74c3c', '#fff', '#e74c3c', '#3498db', '#f1c40f'];
        const rStep = this.radius / rings.length;
        for (let i = 0; i < rings.length; i++) {
            ctx.fillStyle = rings[i];
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius - (i * rStep), 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            ctx.stroke();
        }
    }
}

function initTargets() {
    targets = [new Target(), new Target()];
    targets[1].x = 740;
    targets[1].speed = 2.5;
}

function randomizeWind() {
    // Wind force value between -0.4 and 0.4
    wind = (Math.random() - 0.5) * 0.8;
    updateUI();
}

function resetGame() {
    score = 0;
    arrowsLeft = 10;
    gameState = 'playing';
    activeArrow = null;
    initTargets();
    randomizeWind();
}

function updateUI() {
    document.getElementById('score-display').innerText = `Score: ${score} | Arrows: ${arrowsLeft}`;
    
    const windDisplay = document.getElementById('wind-display');
    if (Math.abs(wind) < 0.1) {
        windDisplay.innerText = "Wind: ➖ Calm";
        windDisplay.style.color = "#2ecc71";
    } else if (wind > 0) {
        windDisplay.innerText = `Wind: ➡️ Right (${(Math.abs(wind)*5).toFixed(1)})`;
        windDisplay.style.color = "#3498db";
    } else {
        windDisplay.innerText = `Wind: ⬅️ Left (${(Math.abs(wind)*5).toFixed(1)})`;
        windDisplay.style.color = "#e74c3c";
    }
}

// Mouse Controls
canvas.addEventListener('mousedown', (e) => {
    if (gameState !== 'playing' || activeArrow !== null) return;
    if (arrowsLeft <= 0) return;

    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    if (Math.hypot(mouseX - bowPos.x, mouseY - bowPos.y) < 60) {
        isAiming = true;
        dragEnd = { x: mouseX, y: mouseY };
    }
});

canvas.addEventListener('mousemove', (e) => {
    if (!isAiming) return;
    const rect = canvas.getBoundingClientRect();
    dragEnd.x = e.clientX - rect.left;
    dragEnd.y = e.clientY - rect.top;
});

canvas.addEventListener('mouseup', () => {
    if (!isAiming) return;
    isAiming = false;

    const dx = bowPos.x - dragEnd.x;
    const dy = bowPos.y - dragEnd.y;
    const power = Math.min(Math.hypot(dx, dy) * 0.15, 22);

    if (power > 2) {
        const angle = Math.atan2(dy, dx);
        activeArrow = {
            x: bowPos.x,
            y: bowPos.y,
            vx: Math.cos(angle) * power,
            vy: Math.sin(angle) * power,
            angle: angle,
            active: true
        };
        arrowsLeft--;
        updateUI();
    }
});

function update() {
    targets.forEach(t => t.update());

    if (activeArrow && activeArrow.active) {
        // Apply wind force to horizontal velocity each frame
        activeArrow.vx += wind * 0.05;

        activeArrow.x += activeArrow.vx;
        activeArrow.y += activeArrow.vy;
        activeArrow.vy += 0.15; // Gravity
        activeArrow.angle = Math.atan2(activeArrow.vy, activeArrow.vx);

        if (activeArrow.x > canvas.width || activeArrow.x < 0 || activeArrow.y > canvas.height || activeArrow.y < 0) {
            activeArrow = null;
            randomizeWind(); // Change wind for the next shot
            checkGameOver();
        } else {
            targets.forEach(t => {
                const dist = Math.hypot(activeArrow.x - t.x, activeArrow.y - t.y);
                if (dist < t.radius) {
                    let hitScore = 10;
                    if (dist < 8) hitScore = 50; // Bullseye!
                    else if (dist < 20) hitScore = 25;

                    score += hitScore;
                    activeArrow = null;
                    randomizeWind(); // Change wind for the next shot
                    updateUI();
                    checkGameOver();
                }
            });
        }
    }
}

function checkGameOver() {
    if (arrowsLeft === 0 && !activeArrow) {
        gameState = 'gameover';
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#27ae60';
    ctx.fillRect(0, canvas.height - 40, canvas.width, 40);

    targets.forEach(t => t.draw());

    if (isAiming) {
        ctx.strokeStyle = '#ff00ff';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(bowPos.x, bowPos.y);
        const pullX = bowPos.x + (bowPos.x - dragEnd.x);
        const pullY = bowPos.y + (bowPos.y - dragEnd.y);
        ctx.lineTo(pullX, pullY);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    ctx.strokeStyle = '#d35400';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(bowPos.x, bowPos.y, 40, -Math.PI / 2, Math.PI / 2);
    ctx.stroke();

    if (activeArrow && activeArrow.active) {
        ctx.save();
        ctx.translate(activeArrow.x, activeArrow.y);
        ctx.rotate(activeArrow.angle);
        ctx.fillStyle = '#fff';
        ctx.fillRect(-15, -2, 30, 4);
        ctx.fillStyle = '#e74c3c';
        ctx.beginPath();
        ctx.moveTo(15, -4);
        ctx.lineTo(23, 0);
        ctx.lineTo(15, 4);
        ctx.fill();
        ctx.restore();
    }

    if (gameState === 'gameover') {
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = '#ffa519';
        ctx.font = 'bold 32px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('Game Over!', canvas.width / 2, canvas.height / 2 - 20);
        
        ctx.fillStyle = '#fff';
        ctx.font = '18px system-ui';
        ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
        
        ctx.font = '14px system-ui';
        ctx.fillStyle = '#aaa';
        ctx.fillText('Click "New Game" to play again', canvas.width / 2, canvas.height / 2 + 60);
        ctx.textAlign = 'left';
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

resetGame();
loop();
</script>
</body>
</html>
