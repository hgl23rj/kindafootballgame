<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Bow and Arrow - Pro Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #game-container {
            background: #222;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 2px solid #444;
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 800px;
            margin-bottom: 10px;
            padding: 0 10px;
            font-size: 13px;
            font-weight: bold;
        }
        .hud-item {
            background: #111;
            padding: 6px 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 14px;
            border: 1px solid #333;
        }
        canvas {
            background: linear-gradient(to bottom, #1e3c72, #2a5298);
            border-radius: 6px;
            display: block;
            border: 2px solid #555;
            cursor: crosshair;
        }
        .footer-controls {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        button {
            padding: 8px 16px;
            background: #4285F4;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #3367d6; }
        .instructions {
            font-size: 11px;
            color: #aaa;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div class="header">
            <div>🎯 ARCHERY PRO</div>
            <div class="hud-item" id="level-display" style="color: #ffa519;">Level: 1 / 10</div>
            <div class="hud-item" id="wind-display" style="color: #3498db;">Wind: ➖ Calm</div>
            <div class="hud-item" id="highscore-display" style="color: #f1c40f;">Best: 0</div>
            <div class="hud-item" id="score-display" style="color: #2ecc71;">Score: 0 | Arrows: 5</div>
        </div>
        <canvas id="gameCanvas" width="800" height="450"></canvas>
        <div class="footer-controls">
            <button onclick="resetCampaign()">Restart Campaign</button>
        </div>
        <div class="instructions">Click anywhere or pull the bow to initialize audio. Clear all 10 levels to claim your crown!</div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let score = 0;
let level = 1;
let arrowsLeft = 5;
let levelScore = 0;
let requiredScore = 100;
let gameState = 'playing'; // 'playing', 'levelclear', 'gameover', 'victory'
let wind = 0;
let highScore = localStorage.getItem('archery_highscore') || 0;

const bowPos = { x: 100, y: 225 };
let isAiming = false;
let dragEnd = { x: 100, y: 225 };
let activeArrow = null;

let targets = [];
let obstacles = [];

// Web Audio API Synth Engine
let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function playSound(type) {
    initAudio();
    if (!audioCtx) return;

    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    let now = audioCtx.currentTime;

    if (type === 'release') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
    } else if (type === 'hit') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, now); // D5
        osc.frequency.setValueAtTime(880, now + 0.08); // A5
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
    } else if (type === 'boss_hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(80, now + 0.2);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
    } else if (type === 'win') {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
            let o = audioCtx.createOscillator();
            let g = audioCtx.createGain();
            o.connect(g);
            g.connect(audioCtx.destination);
            o.type = 'triangle';
            o.frequency.setValueAtTime(freq, now + idx * 0.12);
            g.gain.setValueAtTime(0.3, now + idx * 0.12);
            g.gain.linearRampToValueAtTime(0.01, now + idx * 0.12 + 0.2);
            o.start(now + idx * 0.12);
            o.stop(now + idx * 0.12 + 0.2);
        });
    } else if (type === 'fail') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.linearRampToValueAtTime(80, now + 0.4);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
    }
}

class Target {
    constructor(x, y, radius, speed, dir) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.speed = speed;
        this.direction = dir;
        this.isBoss = false;
        this.bossHP = 0;
    }
    update() {
        this.y += this.speed * this.direction;
        if (this.y - this.radius < 40 || this.y + this.radius > 410) {
            this.direction *= -1;
        }
    }
    draw() {
        const rings = this.isBoss ? ['#8e44ad', '#e74c3c', '#f1c40f', '#fff', '#e74c3c'] : ['#e74c3c', '#fff', '#e74c3c', '#3498db', '#f1c40f'];
        const rStep = this.radius / rings.length;
        for (let i = 0; i < rings.length; i++) {
            ctx.fillStyle = rings[i];
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius - (i * rStep), 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            ctx.stroke();
        }
        if (this.isBoss) {
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 12px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(`HP: ${this.bossHP}`, this.x, this.y - this.radius - 8);
            ctx.textAlign = 'left';
        }
    }
}

class Obstacle {
    constructor(x, y, w, h, speed, dir) {
        this.x = x;
        this.y = y;
        this.width = w;
        this.height = h;
        this.speed = speed;
        this.direction = dir;
    }
    update() {
        this.y += this.speed * this.direction;
        if (this.y < 50 || this.y + this.height > 400) {
            this.direction *= -1;
        }
    }
    draw() {
        ctx.fillStyle = '#e67e22';
        ctx.fillRect(this.x, this.y, this.width, this.height);
        ctx.strokeStyle = '#d35400';
        ctx.lineWidth = 2;
        ctx.strokeRect(this.x, this.y, this.width, this.height);
    }
}

function setupLevel() {
    targets = [];
    obstacles = [];
    arrowsLeft = 5;
    levelScore = 0;

    if (level === 1) { requiredScore = 80; wind = 0; targets.push(new Target(700, 225, 35, 1.5, 1)); }
    else if (level === 2) { requiredScore = 100; wind = 0.15; targets.push(new Target(680, 150, 30, 2, 1)); targets.push(new Target(740, 300, 30, 2, -1)); }
    else if (level === 3) { requiredScore = 120; wind = -0.25; targets.push(new Target(700, 225, 25, 3, 1)); obstacles.push(new Obstacle(450, 150, 20, 120, 1.5, 1)); }
    else if (level === 4) { requiredScore = 150; wind = 0.3; targets.push(new Target(650, 120, 30, 2.5, 1)); targets.push(new Target(750, 320, 30, 2.5, -1)); obstacles.push(new Obstacle(500, 100, 20, 200, 2, -1)); }
    else if (level === 5) { requiredScore = 140; wind = -0.4; targets.push(new Target(700, 225, 22, 3.5, 1)); obstacles.push(new Obstacle(400, 80, 15, 100, 2.5, 1)); obstacles.push(new Obstacle(580, 250, 15, 100, 2.5, -1)); }
    else if (level === 6) { requiredScore = 180; wind = 0.2; targets.push(new Target(660, 150, 25, 3, 1)); targets.push(new Target(730, 300, 25, 3, -1)); targets.push(new Target(700, 225, 20, 4, 1)); }
    else if (level === 7) { requiredScore = 200; wind = -0.35; targets.push(new Target(700, 225, 25, 3.5, 1)); obstacles.push(new Obstacle(480, 50, 20, 140, 3, 1)); obstacles.push(new Obstacle(480, 260, 20, 140, 3, -1)); }
    else if (level === 8) { requiredScore = 220; wind = 0.45; targets.push(new Target(680, 130, 20, 4, 1)); targets.push(new Target(740, 320, 20, 4, -1)); obstacles.push(new Obstacle(520, 120, 15, 160, 3.5, 1)); }
    else if (level === 9) { requiredScore = 250; wind = -0.3; targets.push(new Target(650, 100, 22, 3.5, 1)); targets.push(new Target(710, 225, 22, 3.5, -1)); targets.push(new Target(770, 350, 22, 3.5, 1)); obstacles.push(new Obstacle(420, 100, 15, 120, 3, 1)); obstacles.push(new Obstacle(580, 200, 15, 120, 3, -1)); }
    else if (level === 10) {
        requiredScore = 300;
        wind = 0.5;
        let boss = new Target(720, 225, 45, 2.5, 1);
        boss.isBoss = true;
        boss.bossHP = 6;
        targets.push(boss);
        obstacles.push(new Obstacle(460, 80, 20, 260, 3, 1));
    }

    updateUI();
}

function resetCampaign() {
    score = 0;
    level = 1;
    gameState = 'playing';
    setupLevel();
}

function updateHighScore() {
    if (score > highScore) {
        highScore = score;
        localStorage.setItem('archery_highscore', highScore);
    }
}

function updateUI() {
    updateHighScore();
    document.getElementById('level-display').innerText = `Level: ${level} / 10`;
    document.getElementById('highscore-display').innerText = `Best: ${highScore}`;
    document.getElementById('score-display').innerText = `Score: ${score} | Target: ${requiredScore} | Arrows: ${arrowsLeft}`;
    
    const windDisplay = document.getElementById('wind-display');
    if (Math.abs(wind) < 0.08) {
        windDisplay.innerText = "Wind: ➖ Calm";
        windDisplay.style.color = "#2ecc71";
    } else if (wind > 0) {
        windDisplay.innerText = `Wind: ➡️ Right (${(Math.abs(wind)*4).toFixed(1)})`;
        windDisplay.style.color = "#3498db";
    } else {
        windDisplay.innerText = `Wind: ⬅️ Left (${(Math.abs(wind)*4).toFixed(1)})`;
        windDisplay.style.color = "#e74c3c";
    }
}

// Mouse Controls
canvas.addEventListener('mousedown', (e) => {
    initAudio();
    if (gameState !== 'playing' || activeArrow !== null) return;
    if (arrowsLeft <= 0) return;

    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    if (Math.hypot(mouseX - bowPos.x, mouseY - bowPos.y) < 60) {
        isAiming = true;
        dragEnd = { x: mouseX, y: mouseY };
    }
});

canvas.addEventListener('mousemove', (e) => {
    if (!isAiming) return;
    const rect = canvas.getBoundingClientRect();
    dragEnd.x = e.clientX - rect.left;
    dragEnd.y = e.clientY - rect.top;
});

canvas.addEventListener('mouseup', () => {
    if (!isAiming) return;
    isAiming = false;

    const dx = bowPos.x - dragEnd.x;
    const dy = bowPos.y - dragEnd.y;
    const power = Math.min(Math.hypot(dx, dy) * 0.15, 22);

    if (power > 2) {
        const angle = Math.atan2(dy, dx);
        activeArrow = {
            x: bowPos.x,
            y: bowPos.y,
            vx: Math.cos(angle) * power,
            vy: Math.sin(angle) * power,
            angle: angle,
            active: true
        };
        arrowsLeft--;
        playSound('release');
        updateUI();
    }
});

function update() {
    if (gameState !== 'playing') return;

    targets.forEach(t => t.update());
    obstacles.forEach(o => o.update());

    if (activeArrow && activeArrow.active) {
        activeArrow.vx += wind * 0.04;
        activeArrow.x += activeArrow.vx;
        activeArrow.y += activeArrow.vy;
        activeArrow.vy += 0.15;
        activeArrow.angle = Math.atan2(activeArrow.vy, activeArrow.vx);

        obstacles.forEach(o => {
            if (activeArrow && activeArrow.x > o.x && activeArrow.x < o.x + o.width &&
                activeArrow.y > o.y && activeArrow.y < o.y + o.height) {
                activeArrow = null;
                checkTurnEnd();
            }
        });

        if (activeArrow && (activeArrow.x > canvas.width || activeArrow.x < 0 || activeArrow.y > canvas.height || activeArrow.y < 0)) {
            activeArrow = null;
            checkTurnEnd();
        } else if (activeArrow) {
            targets.forEach(t => {
                const dist = Math.hypot(activeArrow.x - t.x, activeArrow.y - t.y);
                if (dist < t.radius) {
                    if (t.isBoss) {
                        t.bossHP--;
                        score += 50;
                        levelScore += 50;
                        activeArrow = null;
                        playSound('boss_hit');
                        if (t.bossHP <= 0) {
                            score += 150;
                            levelScore += 150;
                            playSound('win');
                            if (levelScore >= requiredScore) {
                                gameState = 'victory';
                            } else {
                                level++;
                                gameState = 'levelclear';
                            }
                        }
                    } else {
                        let hitScore = 20;
                        if (dist < 8) hitScore = 60;
                        else if (dist < 18) hitScore = 40;

                        score += hitScore;
                        levelScore += hitScore;
                        activeArrow = null;
                        playSound('hit');
                    }
                    updateUI();
                    if (gameState === 'playing') checkTurnEnd();
                }
            });
        }
    }
}

function checkTurnEnd() {
    if (levelScore >= requiredScore) {
        if (level === 10) {
            gameState = 'victory';
            playSound('win');
        } else {
            gameState = 'levelclear';
            playSound('win');
        }
    } else if (arrowsLeft === 0 && !activeArrow) {
        gameState = 'gameover';
        playSound('fail');
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#27ae60';
    ctx.fillRect(0, canvas.height - 40, canvas.width, 40);

    obstacles.forEach(o => o.draw());
    targets.forEach(t => t.draw());

    if (isAiming) {
        ctx.strokeStyle = '#ff00ff';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(bowPos.x, bowPos.y);
        const pullX = bowPos.x + (bowPos.x - dragEnd.x);
        const pullY = bowPos.y + (bowPos.y - dragEnd.y);
        ctx.lineTo(pullX, pullY);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    ctx.strokeStyle = '#d35400';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(bowPos.x, bowPos.y, 40, -Math.PI / 2, Math.PI / 2);
    ctx.stroke();

    if (activeArrow && activeArrow.active) {
        ctx.save();
        ctx.translate(activeArrow.x, activeArrow.y);
        ctx.rotate(activeArrow.angle);
        ctx.fillStyle = '#fff';
        ctx.fillRect(-15, -2, 30, 4);
        ctx.fillStyle = '#e74c3c';
        ctx.beginPath();
        ctx.moveTo(15, -4);
        ctx.lineTo(23, 0);
        ctx.lineTo(15, 4);
        ctx.fill();
        ctx.restore();
    }

    if (gameState === 'levelclear') {
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = '#2ecc71';
        ctx.font = 'bold 30px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText(`Level ${level - 1} Cleared!`, canvas.width / 2, canvas.height / 2 - 30);
        
        ctx.fillStyle = '#fff';
        ctx.font = '16px system-ui';
        ctx.fillText(`Score: ${levelScore} / Target: ${requiredScore}`, canvas.width / 2, canvas.height / 2 + 10);
        
        ctx.fillStyle = '#4285F4';
        ctx.fillRect(canvas.width / 2 - 80, canvas.height / 2 + 40, 160, 40);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 15px system-ui';
        ctx.fillText('Next Level ➔', canvas.width / 2, canvas.height / 2 + 65);
        ctx.textAlign = 'left';
    } else if (gameState === 'gameover') {
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = '#e74c3c';
        ctx.font = 'bold 32px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('Out of Arrows!', canvas.width / 2, canvas.height / 2 - 20);
        
        ctx.fillStyle = '#fff';
        ctx.font = '16px system-ui';
        ctx.fillText(`You needed ${requiredScore} points. Total Score: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
        
        ctx.font = '13px system-ui';
        ctx.fillStyle = '#aaa';
        ctx.fillText('Click Restart Campaign to try again', canvas.width / 2, canvas.height / 2 + 60);
        ctx.textAlign = 'left';
    } else if (gameState === 'victory') {
        ctx.fillStyle = 'rgba(0,0,0,0.9)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#f1c40f';
        ctx.font = 'bold 42px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('👑 🏆 👑', canvas.width / 2, canvas.height / 2 - 70);

        ctx.fillStyle = '#ffa519';
        ctx.font = 'bold 28px system-ui';
        ctx.fillText('CHAMPION OF THE ARCHERY REALM!', canvas.width / 2, canvas.height / 2 - 20);

        ctx.fillStyle = '#fff';
        ctx.font = '16px system-ui';
        ctx.fillText(`You conquered all 10 Levels! Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 25);

        ctx.fillStyle = '#2ecc71';
        ctx.font = '14px system-ui';
        ctx.fillText('The Grand Crown and Gold Trophy are yours!', canvas.width / 2, canvas.height / 2 + 60);
        ctx.textAlign = 'left';
    }
}

canvas.addEventListener('click', (e) => {
    if (gameState === 'levelclear') {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        if (mouseX > canvas.width / 2 - 80 && mouseX < canvas.width / 2 + 80 &&
            mouseY > canvas.height / 2 + 40 && mouseY < canvas.height / 2 + 80) {
            setupLevel();
        }
    }
});

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

setupLevel();
loop();
</script>
</body>
</html>
