        ];

        // ============================================================
        //  GAME OBJECTS
        // ============================================================
        const player = {
            x: canvas.width / 2 - PLAYER_WIDTH / 2,
            y: canvas.height - PLAYER_HEIGHT - 12,
            width: PLAYER_WIDTH,
            height: PLAYER_HEIGHT,
            color: '#38bdf8',
            speed: PLAYER_SPEED
        };

        let bullets = [];
        let enemyBullets = [];
        const enemies = [];
        const enemyFormationSlots = [];
        const particles = [];
        const stars = [];

        const ENEMY_STATE = { INACTIVE: 0, ENTERING: 1, FORMATION: 2, DIVING: 3, DEAD: 5 };

        // ============================================================
        //  STARFIELD
        // ============================================================
        function initializeStars(count = 90) {
            stars.length = 0;
            for (let i = 0; i < count; i++) {
                const size = Math.random() * 1.6 + 0.4;
                const bright = Math.random() * 0.6 + 0.2;
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: size,
                    speed: Math.random() * 0.3 + 0.05,
                    color: `rgba(224, 242, 254, ${bright})`,
                    twinkle: Math.random() * 100,
                    twinkleSpeed: 0.02 + Math.random() * 0.03
                });
            }
        }

        function drawStarfield() {
            stars.forEach(s => {
                s.twinkle += s.twinkleSpeed;
                const alpha = parseFloat(s.color.split(',')[3] || '0.4') * (0.6 + 0.4 * Math.sin(s.twinkle));
                ctx.fillStyle = `rgba(224, 242, 254, ${alpha})`;
                ctx.fillRect(s.x, s.y, s.size, s.size);
                s.y += s.speed;
                if (s.y > canvas.height) {
                    s.y = 0;
                    s.x = Math.random() * canvas.width;
                }
            });
        }

        // ============================================================
        //  ENEMY DRAW FUNCTIONS (pixel‑art style)
        // ============================================================
        function drawBee(e) {
            ctx.fillStyle = e.color;
            ctx.fillRect(e.x + 2, e.y, e.width - 4, e.height);
            ctx.fillStyle = '#fff';
            ctx.fillRect(e.x + 4, e.y + 4, 2, 2);
            ctx.fillRect(e.x + e.width - 6, e.y + 4, 2, 2);
            // wings
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.fillRect(e.x, e.y + 2, 2, 6);
            ctx.fillRect(e.x + e.width - 2, e.y + 2, 2, 6);
        }

        function drawButterfly(e) {
            ctx.fillStyle = '#f43f5e';
            ctx.fillRect(e.x + 2, e.y, e.width - 4, e.height);
            ctx.fillStyle = '#facc15';
            ctx.fillRect(e.x, e.y + 4, 2, e.height - 8);
            ctx.fillRect(e.x + e.width - 2, e.y + 4, 2, e.height - 8);
            // eyes
            ctx.fillStyle = '#fff';
            ctx.fillRect(e.x + 4, e.y + 4, 2, 2);
            ctx.fillRect(e.x + e.width - 6, e.y + 4, 2, 2);
        }

        function drawBoss(e) {
            ctx.fillStyle = '#a855f7';
            ctx.fillRect(e.x + 2, e.y, e.width - 4, e.height);
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(e.x, e.y + 6, e.width, e.height - 10);
            // core
            ctx.fillStyle = '#facc15';
            ctx.fillRect(e.x + e.width / 2 - 2, e.y + e.height / 2 - 2, 4, 4);
        }

        function drawMegaBoss(e) {
            if (!bossData) return;
            const phase = bossData.phase || 1;
            let color1, color2, glowColor;
            if (phase === 1) { color1 = '#0f2a4a';
                color2 = '#38bdf8';
                glowColor = 'rgba(56,189,248,0.15)'; } else if (phase === 2) { color1 = '#2a0f3a';
                color2 = '#a855f7';
                glowColor = 'rgba(168,85,247,0.20)'; } else { color1 = '#3a0f0f';
                color2 = '#f43f5e';
                glowColor = 'rgba(244,63,94,0.25)'; }

            ctx.shadowColor = glowColor;
            ctx.shadowBlur = 25;

            const grad = ctx.createLinearGradient(e.x, e.y, e.x + e.width, e.y + e.height);
            grad.addColorStop(0, color1);
            grad.addColorStop(1, color2);
            ctx.fillStyle = grad;
            ctx.fillRect(e.x, e.y, e.width, e.height);
            ctx.shadowBlur = 0;

            ctx.strokeStyle = color2;
            ctx.lineWidth = 1.5;
            ctx.strokeRect(e.x, e.y, e.width, e.height);

            ctx.fillStyle = color2;
            ctx.globalAlpha = 0.25;
            ctx.fillRect(e.x + 12, e.y + 12, e.width - 24, e.height - 24);
            ctx.globalAlpha = 1;

            const pulse = 0.7 + 0.3 * Math.sin(performance.now() / 300);
            ctx.fillStyle = color2;
            ctx.globalAlpha = pulse * 0.5;
            ctx.beginPath();
            ctx.arc(e.x + e.width / 2, e.y + e.height / 2, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;

            ctx.fillStyle = '#f8fafc';
            ctx.font = '6px "Press Start 2P"';
            ctx.textAlign = 'center';
            ctx.fillText('⚔', e.x + e.width / 2, e.y + 10);
            ctx.fillStyle = color2;
            ctx.font = '5px "Press Start 2P"';
            ctx.fillText(`P${phase}`, e.x + e.width / 2, e.y + e.height - 6);
        }

        // ============================================================
        //  ENEMY CREATION (normal levels, instant spawn)
        // ============================================================
        function createEnemy(type, formationRow, formationCol, config) {
            const definition = enemyDefinitions[type];
            if (!definition) return null;
            const slotIndex = formationRow * FORMATION_COLS + formationCol;
            const targetX = (config.startX + canvas.width / 2 - (config.formation[formationRow].length / 2 * config
                .colSpace)) + formationCol * config.colSpace;
            const targetY = config.startY + formationRow * config.rowSpace;

            enemyFormationSlots[slotIndex] = { x: targetX, y: targetY, occupied: false, enemyId: null };

            let w = ENEMY_WIDTH,
                h = ENEMY_HEIGHT,
                hp = 1;

            return {
                id: 'enemy_' + Date.now() + '_' + Math.random(),
                type,
                x: targetX,
                y: targetY,
                width: w,
                height: h,
                hp,
                maxHp: hp,
                color: definition.color,
                state: ENEMY_STATE.FORMATION,
                targetX,
                targetY,
                formationSlotIndex: slotIndex,
                entrancePath: [],
                divePath: null,
                pathIndex: 0,
                speed: 2.5 + level * 0.2,
                diveTimer: performance.now() + config.attackMin + Math.random() * (config.attackMax - config.attackMin),
                lastStateChangeTime: performance.now(),
                moveDir: 1
            };
        }

        function setupFormation(config) {
            enemies.length = 0;
            enemyFormationSlots.length = 0;
            enemiesRemaining = 0;

            for (let r = 0; r < config.formation.length; r++) {
                for (let c = 0; c < config.formation[r].length; c++) {
                    const type = config.formation[r][c];
                    if (type !== ENEMY_TYPE.EMPTY) {
                        const enemy = createEnemy(type, r, c, config);
                        if (enemy) {
                            // occupy slot
                            const slot = enemyFormationSlots[enemy.formationSlotIndex];
                            if (slot) { slot.occupied = true;
                                slot.enemyId = enemy.id; }
                            enemies.push(enemy);
                            enemiesRemaining++;
                        }
                    } else {
                        const slotIndex = r * FORMATION_COLS + c;
                        const slotX = (config.startX + canvas.width / 2 - (config.formation[r].length / 2 * config
                            .colSpace)) + c * config.colSpace;
                        const slotY = config.startY + r * config.rowSpace;
                        enemyFormationSlots[slotIndex] = { x: slotX, y: slotY, occupied: false, enemyId: null };
                    }
                }
            }
            // set dive timers for all enemies
            enemies.forEach(e => {
                e.diveTimer = performance.now() + config.attackMin + Math.random() * (config.attackMax - config
                .attackMin);
            });
        }

        function freeFormationSlot(enemy) {
            if (enemy.formationSlotIndex >= 0 && enemy.formationSlotIndex < enemyFormationSlots.length) {
                const slot = enemyFormationSlots[enemy.formationSlotIndex];
                if (slot && slot.enemyId === enemy.id) { slot.occupied = false;
                    slot.enemyId = null; }
            }
        }

        // ============================================================
        //  BOSS SYSTEM
        // ============================================================
        function spawnBoss() {
            bossActive = true;
            const w = 74,
                h = 52;
            const boss = {
                id: 'boss_' + Date.now(),
                type: ENEMY_TYPE.MEGA_BOSS,
                x: canvas.width / 2 - w / 2,
                y: 50,
                width: w,
                height: h,
                hp: 80,
                maxHp: 80,
                color: '#34d399',
                state: ENEMY_STATE.FORMATION,
                formationSlotIndex: -1,
                pathIndex: 0,
                speed: 0.8,
                moveDir: 1,
                diveTimer: 0,
                lastStateChangeTime: performance.now()
            };
            bossData = {
                enemy: boss,
                phase: 1,
                shootTimer: 0,
                spawnTimer: 0,
                phaseTransitionShown: false,
                hitFlash: 0
            };
            enemies.push(boss);
            enemiesRemaining = 1;
            bossHealthContainer.style.display = 'block';
            updateBossHealthUI();
            bossPhaseLabel.textContent = 'PHASE 1';
            bossHealthFill.style.background = 'linear-gradient(90deg, #34d399, #38bdf8)';
            playSound('levelStart', 10);
        }

        function updateBossHealthUI() {
            if (!bossData) return;
            const pct = Math.max(0, (bossData.enemy.hp / bossData.enemy.maxHp) * 100);
            bossHealthFill.style.width = pct + '%';
            const phase = bossData.phase || 1;
            bossPhaseLabel.textContent = `PHASE ${phase}`;
            if (phase === 1) bossHealthFill.style.background = 'linear-gradient(90deg, #34d399, #38bdf8)';
            else if (phase === 2) bossHealthFill.style.background = 'linear-gradient(90deg, #a855f7, #c084fc)';
            else bossHealthFill.style.background = 'linear-gradient(90deg, #f43f5e, #fb7185)';
        }

        function updateBoss() {
            if (!bossData || !bossActive) return;
            const boss = bossData.enemy;
            if (boss.state === ENEMY_STATE.DEAD) return;

            const now = performance.now();

            // movement
            const speed = 0.8 + (bossData.phase - 1) * 0.5;
            boss.x += boss.moveDir * speed;
            if (boss.x < 20 || boss.x + boss.width > canvas.width - 20) {
                boss.moveDir *= -1;
            }

            // phase transitions
            const hpPct = boss.hp / boss.maxHp;
            let newPhase = 1;
            if (hpPct <= 0.30) newPhase = 3;
            else if (hpPct <= 0.60) newPhase = 2;
            if (newPhase !== bossData.phase) {
                bossData.phase = newPhase;
                bossData.phaseTransitionShown = true;
                bossPhaseLabel.textContent = `PHASE ${newPhase}`;
                if (newPhase === 2) bossHealthFill.style.background = 'linear-gradient(90deg, #a855f7, #c084fc)';
                else if (newPhase === 3) bossHealthFill.style.background = 'linear-gradient(90deg, #f43f5e, #fb7185)';
                for (let i = 0; i < 20; i++) {
                    createExplosion(boss.x + boss.width / 2, boss.y + boss.height / 2,
                        newPhase === 1 ? '#38bdf8' : newPhase === 2 ? '#a855f7' : '#f43f5e', 6);
                }
                playSound('hit', 10);
            }

            // shooting
            const shootInterval = bossData.phase === 1 ? 800 : bossData.phase === 2 ? 500 : 280;
            const bulletCount = bossData.phase === 1 ? 2 : bossData.phase === 2 ? 3 : 5;
            const spread = bossData.phase === 1 ? 0.4 : bossData.phase === 2 ? 0.7 : 1.0;

            if (!bossData.shootTimer) bossData.shootTimer = now;
            if (now - bossData.shootTimer > shootInterval) {
                bossData.shootTimer = now;
                const cx = boss.x + boss.width / 2;
                const cy = boss.y + boss.height;
                const targetX = player.x + player.width / 2;
                const targetY = player.y + player.height / 2;
                const angle = Math.atan2(targetY - cy, targetX - cx);

                for (let i = 0; i < bulletCount; i++) {
                    const offset = (i / (bulletCount - 1 || 1) - 0.5) * spread;
                    const a = angle + offset;
                    const speed = 2.8 + bossData.phase * 0.5;
                    enemyBullets.push({
                        x: cx - 2,
                        y: cy,
                        w: 4,
                        h: 6,
                        vx: Math.cos(a) * speed,
                        vy: Math.sin(a) * speed,
                        color: bossData.phase === 1 ? '#38bdf8' : bossData.phase === 2 ? '#c084fc' : '#fb7185',
                        life: 200
                    });
                }
                playSound('shoot', 10);
            }

            // spawn minions
            if (bossData.phase >= 2) {
                const spawnInterval = bossData.phase === 2 ? 4000 : 2200;
                const count = bossData.phase === 2 ? 1 : 2;
                if (!bossData.spawnTimer) bossData.spawnTimer = now;
                if (now - bossData.spawnTimer > spawnInterval) {
                    bossData.spawnTimer = now;
                    for (let i = 0; i < count; i++) {
                        const type = Math.random() < 0.5 ? ENEMY_TYPE.BEE : ENEMY_TYPE.BUTTERFLY;
                        const minion = {
                            id: 'minion_' + Date.now() + '_' + i,
                            type: type,
                            x: boss.x + Math.random() * boss.width,
                            y: boss.y + boss.height,
                            width: ENEMY_WIDTH,
                            height: ENEMY_HEIGHT,
                            hp: 1,
                            maxHp: 1,
                            color: enemyDefinitions[type].color,
                            state: ENEMY_STATE.ENTERING,
                            targetX: player.x + (Math.random() - 0.5) * 120,
                            targetY: canvas.height * 0.5 + Math.random() * 80,
                            formationSlotIndex: -1,
                            entrancePath: null,
                            divePath: null,
                            pathIndex: 0,
                            speed: 2.8 + Math.random() * 0.6,
                            diveTimer: 0,
                            lastStateChangeTime: now,
                            moveDir: 1,
                            isMinion: true
                        };
                        minion.entrancePath = [
                            { x: minion.x, y: minion.y },
                            { x: minion.targetX, y: minion.targetY }
                        ];
                        minion.state = ENEMY_STATE.ENTERING;
                        minion.pathIndex = 0;
                        enemies.push(minion);
                        enemiesRemaining++;
                    }
                }
            }

            if (bossData.hitFlash > 0) bossData.hitFlash -= 1;
        }

        // ============================================================
        //  PARTICLES
        // ============================================================
        function createExplosion(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1;
                particles.push({
                    x,
                    y,
                    size: Math.random() * 3 + 1.5,
                    speedX: Math.cos(angle) * speed,
                    speedY: Math.sin(angle) * speed,
                    life: 30 + Math.random() * 25,
                    maxLife: 55,
                    color: color
                });
            }
        }

        function updateAndDrawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.speedX;
                p.y += p.speedY;
                p.speedX *= 0.98;
                p.speedY *= 0.98;
                p.life -= 1;
                if (p.life <= 0) { particles.splice(i, 1); } else {
                    const alpha = Math.max(0, p.life / p.maxLife);
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
                    ctx.globalAlpha = 1;
                }
            }
        }

        // ============================================================
        //  PLAYER
        // ============================================================
        function drawPlayer() {
            if (playerInvincible && Math.floor((playerInvincibleEndTime - performance.now()) / 150) % 2 === 0) return;
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(player.x + 3, player.y, player.width - 6, player.height - 4);
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(player.x, player.y + 5, 3, player.height - 5);
            ctx.fillRect(player.x + player.width - 3, player.y + 5, 3, player.height - 5);
            ctx.fillStyle = '#f43f5e';
            ctx.fillRect(player.x + player.width / 2 - 1, player.y + 2, 2, 2);
        }

        function updatePlayer() {
            if (keys['ArrowLeft'] || keys['KeyA'] || leftButtonPressed) player.x -= player.speed;
            if (keys['ArrowRight'] || keys['KeyD'] || rightButtonPressed) player.x += player.speed;
            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
            if (playerInvincible && performance.now() > playerInvincibleEndTime) playerInvincible = false;
        }

        // ============================================================
        //  BULLETS
        // ============================================================
        function drawBullets() {
            ctx.fillStyle = '#38bdf8';
            bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));
        }

        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= BULLET_SPEED;
                if (bullets[i].y + bullets[i].height < 0) bullets.splice(i, 1);
            }
        }

        function fireBullet() {
            if (!gameRunning || gamePaused || gameOver || levelTransitioning) return;
            if (bullets.length < MAX_PLAYER_BULLETS) {
                bullets.push({
                    x: player.x + player.width / 2 - BULLET_WIDTH / 2,
                    y: player.y - BULLET_HEIGHT,
                    width: BULLET_WIDTH,
                    height: BULLET_HEIGHT
                });
                playSound('shoot', level);
            }
        }

        // ============================================================
        //  ENEMY BULLETS
        // ============================================================
        function updateEnemyBullets() {
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const b = enemyBullets[i];
                b.x += b.vx;
                b.y += b.vy;
                b.life--;
                if (b.y > canvas.height + 20 || b.y < -20 || b.x < -20 || b.x > canvas.width + 20 || b.life <= 0) {
                    enemyBullets.splice(i, 1);
                    continue;
                }
                if (!playerInvincible) {
                    const pb = { x: player.x + 2, y: player.y + 2, w: player.width - 4, h: player.height - 4 };
                    if (b.x < pb.x + pb.w && b.x + b.w > pb.x &&
                        b.y < pb.y + pb.h && b.y + b.h > pb.y) {
                        enemyBullets.splice(i, 1);
                        handlePlayerHit();
                        break;
                    }
                }
            }
        }

        function drawEnemyBullets() {
            enemyBullets.forEach(b => {
                ctx.fillStyle = b.color || '#f43f5e';
                ctx.shadowColor = b.color || '#f43f5e';
                ctx.shadowBlur = 12;
                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.shadowBlur = 0;
            });
        }

        // ============================================================
        //  ENEMY UPDATE (normal)
        // ============================================================
        function updateEnemies() {
            const now = performance.now();
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                if (!enemy || enemy.state === ENEMY_STATE.DEAD) continue;

                if (enemy.type === ENEMY_TYPE.MEGA_BOSS && bossActive) {
                    updateBoss();
                    continue;
                }

                // Diving logic for normal enemies in formation
                if (enemy.state === ENEMY_STATE.FORMATION) {
                    if (now > enemy.diveTimer && enemy.type !== ENEMY_TYPE.MEGA_BOSS) {
                        startDive(enemy);
                    }
                } else if (enemy.state === ENEMY_STATE.DIVING) {
                    moveAlongPath(enemy, enemy.divePath, ENEMY_STATE.FORMATION);
                } else if (enemy.state === ENEMY_STATE.ENTERING) {
                    moveAlongPath(enemy, enemy.entrancePath, ENEMY_STATE.FORMATION);
                }
            }
            // remove dead
            for (let i = enemies.length - 1; i >= 0; i--) {
                if (enemies[i].state === ENEMY_STATE.DEAD && enemies[i].type !== ENEMY_TYPE.MEGA_BOSS) {
                    enemies.splice(i, 1);
                }
            }
        }

        function moveAlongPath(enemy, path, nextState) {
            if (!path || path.length === 0 || enemy.pathIndex >= path.length) {
                if (nextState === ENEMY_STATE.FORMATION) {
                    if (enemy.isMinion) {
                        // minion goes directly to dive
                        enemy.state = ENEMY_STATE.DIVING;
                        enemy.divePath = [
                            { x: enemy.x, y: enemy.y },
                            { x: player.x + (Math.random() - 0.5) * 100, y: canvas.height * 0.7 }
                        ];
                        enemy.pathIndex = 0;
                        enemy.speed = 3.5 + Math.random() * 0.5;
                    } else {
                        // assign back to formation slot (already there)
                        enemy.state = ENEMY_STATE.FORMATION;
                    }
                } else {
                    enemy.state = nextState;
                }
                enemy.pathIndex = 0;
                return;
            }
            const pt = path[enemy.pathIndex];
            const dx = pt.x - enemy.x,
                dy = pt.y - enemy.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < enemy.speed) {
                enemy.x = pt.x;
                enemy.y = pt.y;
                enemy.pathIndex++;
                if (enemy.pathIndex >= path.length) moveAlongPath(enemy, path, nextState);
            } else {
                enemy.x += (dx / dist) * enemy.speed;
                enemy.y += (dy / dist) * enemy.speed;
            }
        }

        function startDive(enemy) {
            if (enemy.state !== ENEMY_STATE.FORMATION || !currentLevelConfig) return;
            const slot = enemyFormationSlots[enemy.formationSlotIndex];
            if (!slot) return;
            freeFormationSlot(enemy);
            enemy.state = ENEMY_STATE.DIVING;
            enemy.pathIndex = 0;
            const tx = player.x + (Math.random() - 0.5) * 200;
            const ty = canvas.height * 0.6;
            enemy.divePath = [
                { x: enemy.x + 40, y: enemy.y + 40 },
                { x: tx, y: ty },
                { x: slot.x, y: slot.y }
            ];
            enemy.speed = 3 + level * 0.25;
        }

        // ============================================================
        //  COLLISIONS
        // ============================================================
        function checkCollisions() {
            // Player bullets vs enemies
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    if (e.state === ENEMY_STATE.DEAD) continue;
                    if (b.x < e.x + e.width && b.x + b.width > e.x &&
                        b.y < e.y + e.height && b.y + b.height > e.y) {
                        bullets.splice(i, 1);
                        handleEnemyHit(e);
                        break;
                    }
                }
            }

            // Enemy collision with player
            if (!playerInvincible) {
                const ph = { x: player.x + 2, y: player.y + 2, w: player.width - 4, h: player.height - 4 };
                for (const e of enemies) {
                    if (e.state === ENEMY_STATE.DEAD) continue;
                    if (ph.x < e.x + e.width && ph.x + ph.w > e.x &&
                        ph.y < e.y + e.height && ph.y + ph.h > e.y) {
                        handlePlayerHit();
                        break;
                    }
                }
            }
        }

        function handleEnemyHit(enemy) {
            if (enemy.type === ENEMY_TYPE.MEGA_BOSS && bossActive) {
                bossData.enemy.hp--;
                bossData.hitFlash = 6;
                updateBossHealthUI();
                createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, '#34d399', 5);
                playSound('bossHit', 10);
                if (bossData.enemy.hp <= 0) {
                    bossActive = false;
                    enemy.state = ENEMY_STATE.DEAD;
                    bossHealthContainer.style.display = 'none';
                    score += 5000;
                    updateStatusDisplay();
                    playSound('bossDefeat', 10);
                    for (let k = 0; k < 8; k++) {
                        setTimeout(() => {
                            createExplosion(
                                enemy.x + Math.random() * enemy.width,
                                enemy.y + Math.random() * enemy.height,
                                ['#34d399', '#38bdf8', '#facc15', '#f43f5e', '#a855f7'][k % 5],
                                20 + Math.random() * 15
                            );
                        }, k * 180);
                    }
                    enemiesRemaining = 0;
                    setTimeout(() => {
                        checkLevelClear();
                    }, 600);
                }
                return;
            }

            // Normal enemy
            enemy.hp--;
            playSound('hit', level);
            createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, enemy.color, 8);

            if (enemy.hp <= 0) {
                const def = enemyDefinitions[enemy.type];
                score += def ? def.pointsFormation : 100;
                if (score >= nextExtraLifeScore) { playerLives++;
                    nextExtraLifeScore += 40000; }
                updateStatusDisplay();
                freeFormationSlot(enemy);
                enemy.state = ENEMY_STATE.DEAD;
                enemiesRemaining--;
                checkLevelClear();
            }
        }

        function handlePlayerHit() {
            if (playerInvincible) return;
            playerLives--;
            updateStatusDisplay();
            playSound('playerHit', level);
            createExplosion(player.x + player.width / 2, player.y + player.height / 2, '#f43f5e', 18);
            if (playerLives <= 0) {
                setGameOver('MISSION FAILED!');
            } else {
                playerInvincible = true;
                playerInvincibleEndTime = performance.now() + PLAYER_INVINCIBILITY_DURATION;
                player.x = canvas.width / 2 - player.width / 2;
            }
        }

        // ============================================================
        //  LEVEL MANAGEMENT
        // ============================================================
        function checkLevelClear() {
            if (enemiesRemaining <= 0 && !levelTransitioning && gameRunning) {
                levelTransitioning = true;
                if (level >= levels.length) {
                    setGameOver(`🏆 VICTÓRIA!<br>TODOS OS 10 NÍVEIS COMPLETOS!<br><br><span style="font-size:7px; color:#34d399;">Dr. Francisco Lima · Nutrição Integrativa</span>`);
                    return;
                }
                messageDisplay.innerHTML =
                    `LEVEL ${level} CLEARED!<br><span style="font-size:7px; color:#34d399;">✦ Dr. Francisco Lima · Nutrição ✦</span>`;
                messageDisplay.style.borderColor = '#34d399';
                messageDisplay.style.color = '#34d399';
                messageDisplay.style.display = 'block';

                setTimeout(() => {
                    messageDisplay.style.display = 'none';
                    messageDisplay.style.borderColor = '#f87171';
                    messageDisplay.style.color = '#f87171';
                    level++;
                    startNextLevel();
                    levelTransitioning = false;
                }, 2800);
            }
        }

        function startNextLevel() {
            if (level > levels.length) return;
            currentLevelConfig = levels[level - 1];
            playSound('levelStart', level);
            updateStatusDisplay();
            bullets.length = 0;
            enemyBullets.length = 0;
            particles.length = 0;
            initializeStars();

            if (currentLevelConfig.isBossLevel) {
                bossActive = false;
                bossData = null;
                enemies.length = 0;
                enemyFormationSlots.length = 0;
                enemiesRemaining = 1;
                bossHealthContainer.style.display = 'block';
                spawnBoss();
            } else {
                bossHealthContainer.style.display = 'none';
                bossActive = false;
                bossData = null;
                setupFormation(currentLevelConfig);
            }
        }

        // ============================================================
        //  STATUS DISPLAY
        // ============================================================
        function updateStatusDisplay() {
            scoreDisplay.textContent = `SCORE: ${score}`;
            levelDisplay.textContent = `LEVEL: ${level}`;
            livesIconsContainer.innerHTML = '';
            for (let i = 0; i < playerLives; i++) {
                const icon = document.createElement('div');
                icon.className = 'life-icon';
                livesIconsContainer.appendChild(icon);
            }
        }

        // ============================================================
        //  GAME OVER / RESET
        // ============================================================
        function setGameOver(msg) {
            gameOver = true;
            gameRunning = false;
            bossHealthContainer.style.display = 'none';
            messageDisplay.innerHTML =
                `${msg}<br>FINAL SCORE: ${score}<br><br><span style="font-size:7px; color:#38bdf8;">Dr. Francisco Lima · Nutrição</span>`;
            messageDisplay.style.display = 'block';
            startButton.textContent = 'RESTART';
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
        }

        function resetGame() {
            score = 0;
            level = 1;
            playerLives = 3;
            nextExtraLifeScore = 20000;
            gameOver = false;
            gamePaused = false;
            playerInvincible = false;
            levelTransitioning = false;
            bossActive = false;
            bossData = null;
            player.x = canvas.width / 2 - player.width / 2;
            player.y = canvas.height - player.height - 12;
            bullets.length = 0;
            enemyBullets.length = 0;
            enemies.length = 0;
            particles.length = 0;
            enemyFormationSlots.length = 0;
            enemiesRemaining = 0;
            currentLevelConfig = null;
            messageDisplay.style.display = 'none';
            bossHealthContainer.style.display = 'none';
            pauseButton.textContent = 'PAUSE';
            pauseButton.disabled = true;
            startButton.textContent = 'START';
            updateStatusDisplay();
            drawTitleScreen();
            leftButtonPressed = false;
            rightButtonPressed = false;
        }

        // ============================================================
        //  DRAW TITLE
        // ============================================================
        function drawTitleScreen() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            initializeStars();
            drawStarfield();

            ctx.fillStyle = 'rgba(56,189,248,0.06)';
            ctx.fillRect(0, canvas.height / 2 - 60, canvas.width, 2);
            ctx.fillRect(0, canvas.height / 2 + 50, canvas.width, 2);

            ctx.textAlign = 'center';
            ctx.fillStyle = '#38bdf8';
            ctx.font = '16px "Press Start 2P"';
            ctx.shadowColor = 'rgba(56,189,248,0.2)';
            ctx.shadowBlur = 20;
            ctx.fillText('GALAGA', canvas.width / 2, canvas.height / 2 - 48);
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#facc15';
            ctx.font = '10px "Press Start 2P"';
            ctx.fillText('✦ ARCADE ✦', canvas.width / 2, canvas.height / 2 - 22);

            ctx.fillStyle = '#f0f6fc';
            ctx.font = '7px "Press Start 2P"';
            ctx.fillText('PRESS START', canvas.width / 2, canvas.height / 2 + 16);

            ctx.fillStyle = '#34d399';
            ctx.font = '6px "Press Start 2P"';
            ctx.fillText('10 NÍVEIS · CHEFE FINAL', canvas.width / 2, canvas.height / 2 + 44);

            ctx.fillStyle = 'rgba(148,163,184,0.5)';
            ctx.font = '5px "Press Start 2P"';
            ctx.fillText('Dr. Francisco Lima · Nutrição', canvas.width / 2, canvas.height / 2 + 68);

            player.x = canvas.width / 2 - PLAYER_WIDTH / 2;
            drawPlayer();
        }

        // ============================================================
        //  MAIN LOOP
        // ============================================================
        function gameLoop() {
            if (gameOver) return;
            animationFrameId = requestAnimationFrame(gameLoop);

            if (gamePaused || levelTransitioning) {
                if (gamePaused) {
                    ctx.fillStyle = 'rgba(5,8,15,0.82)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.textAlign = 'center';
                    ctx.font = '14px "Press Start 2P"';
                    ctx.fillStyle = '#38bdf8';
                    ctx.shadowColor = 'rgba(56,189,248,0.15)';
                    ctx.shadowBlur = 20;
                    ctx.fillText('⏸ PAUSED', canvas.width / 2, canvas.height / 2);
                    ctx.shadowBlur = 0;
                }
                return;
            }
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawStarfield();

            const grad = ctx.createRadialGradient(
                canvas.width / 2, canvas.height / 2, 100,
                canvas.width / 2, canvas.height / 2, 400
            );
            grad.addColorStop(0, 'rgba(5,8,15,0)');
            grad.addColorStop(1, 'rgba(5,8,15,0.35)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            updatePlayer();
            updateBullets();
            updateEnemyBullets();
            updateEnemies();
            checkCollisions();

            drawPlayer();
            drawBullets();
            drawEnemyBullets();
            enemies.forEach(e => {
                if (e.type === ENEMY_TYPE.MEGA_BOSS) {
                    drawMegaBoss(e);
                } else {
                    const def = enemyDefinitions[e.type];
                    if (def && def.drawFunc) def.drawFunc(e);
                }
            });
            updateAndDrawParticles();

            // debug: if no enemies and level not boss, show a hint? 
            // but not needed now.
        }

        // ============================================================
        //  KEYBOARD
        // ============================================================
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault();
                fireBullet(); }
        });
        document.addEventListener('keyup', (e) => { keys[e.code] = false; });

        // ============================================================
        //  BUTTONS
        // ============================================================
        let leftButtonPressed = false,
            rightButtonPressed = false;

        function setupButtonListeners(btn, setter) {
            btn.addEventListener('mousedown', (e) => { e.preventDefault();
                setter(true); });
            btn.addEventListener('mouseup', (e) => { e.preventDefault();
                setter(false); });
            btn.addEventListener('mouseleave', () => { setter(false); });
            btn.addEventListener('touchstart', (e) => { e.preventDefault();
                setter(true); }, { passive: false });
            btn.addEventListener('touchend', (e) => { e.preventDefault();
                setter(false); }, { passive: false });
        }
        setupButtonListeners(leftButton, (v) => leftButtonPressed = v);
        setupButtonListeners(rightButton, (v) => rightButtonPressed = v);

        fireButton.addEventListener('mousedown', (e) => { e.preventDefault();
            fireBullet(); });
        fireButton.addEventListener('touchstart', (e) => { e.preventDefault();
            fireBullet(); }, { passive: false });
        fireButton.addEventListener('click', (e) => { e.preventDefault();
            fireBullet(); });

        // ============================================================
        //  START / PAUSE / SOUND
        // ============================================================
        startButton.addEventListener('click', function() {
            initAudio();
            if (!gameRunning || gameOver) {
                resetGame();
                gameRunning = true;
                gameOver = false;
                gamePaused = false;
                levelTransitioning = false;
                pauseButton.disabled = false;
                messageDisplay.style.display = 'none';
                startNextLevel();
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                animationFrameId = requestAnimationFrame(gameLoop);
                this.textContent = 'RESTART';
            }
        });

        pauseButton.addEventListener('click', function() {
            if (!gameRunning || gameOver || levelTransitioning) return;
            gamePaused = !gamePaused;
            this.textContent = gamePaused ? 'RESUME' : 'PAUSE';
            if (!gamePaused && animationFrameId) {
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                animationFrameId = requestAnimationFrame(gameLoop);
            }
        });

        soundButton.addEventListener('click', function() {
            if (soundButton.disabled) return;
            soundOn = !soundOn;
            this.textContent = `SOUND: ${soundOn ? 'ON' : 'OFF'}`;
            if (soundOn) initAudio();
        });

        // ============================================================
        //  INIT
        // ============================================================
        resetGame();
    
})();
</script>
</body>
</html>
